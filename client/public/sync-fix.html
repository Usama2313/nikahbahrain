<!DOCTYPE html>
<html>
<head>
  <title>Profile Sync Fix</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; background: #1a1a2e; color: #eee; }
    .box { background: #16213e; border-radius: 12px; padding: 24px; margin: 16px 0; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #60a5fa; }
    button { background: #d4af37; border: none; color: #1a1a2e; padding: 12px 24px; 
             border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #e5c348; }
    pre { background: #0f0f23; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
    h1 { color: #d4af37; }
  </style>
</head>
<body>
  <h1>🔧 Profile Sync Fix Tool</h1>
  <p>This page will extract profiles stuck in your desktop browser's localStorage and push them to the server so mobile can see them too.</p>
  
  <div class="box">
    <h3>Step 1: Check localStorage</h3>
    <div id="localStorage-status">Checking...</div>
  </div>

  <div class="box">
    <h3>Step 2: Check Server</h3>
    <div id="server-status">Checking...</div>
  </div>

  <div class="box">
    <h3>Step 3: Sync</h3>
    <button id="syncBtn" onclick="syncToServer()" disabled>Sync Profiles to Server</button>
    <div id="sync-status" style="margin-top:12px;"></div>
  </div>

  <div class="box">
    <h3>Log</h3>
    <pre id="log"></pre>
  </div>

  <script>
    const API_BASE = '/api';
    const logEl = document.getElementById('log');
    
    function log(msg) {
      logEl.textContent += msg + '\n';
      console.log(msg);
    }

    let localProfiles = [];
    let serverCount = 0;
    let missingProfiles = [];

    async function checkAll() {
      // Check localStorage
      try {
        const raw = JSON.parse(localStorage.getItem('nikah_custom_profiles') || '[]');
        localProfiles = raw.filter(p => p && p.id);
        const statusEl = document.getElementById('localStorage-status');
        if (localProfiles.length > 0) {
          statusEl.innerHTML = '<span class="info">Found ' + localProfiles.length + ' profile(s) in localStorage:</span>';
          localProfiles.forEach(p => {
            statusEl.innerHTML += '<br>&nbsp;&nbsp;• ID: <b>' + p.id + '</b> — ' + (p.name || 'No name');
            log('localStorage: ' + p.id + ' — ' + (p.name || 'No name'));
          });
        } else {
          statusEl.innerHTML = '<span class="success">✓ No profiles stuck in localStorage</span>';
          log('localStorage is clean — no custom profiles');
        }
      } catch (e) {
        document.getElementById('localStorage-status').innerHTML = '<span class="error">Error reading localStorage: ' + e.message + '</span>';
        log('Error: ' + e.message);
      }

      // Check server
      try {
        const res = await fetch(API_BASE + '/profiles');
        const data = await res.json();
        serverCount = data.count;
        const serverIds = new Set(data.profiles.map(p => String(p.id)));
        document.getElementById('server-status').innerHTML = '<span class="info">Server has ' + data.count + ' profiles</span>';
        log('Server profile count: ' + data.count);

        // Find profiles in localStorage that are NOT on server
        missingProfiles = localProfiles.filter(p => !serverIds.has(String(p.id)));
        if (missingProfiles.length > 0) {
          document.getElementById('server-status').innerHTML += '<br><span class="error">⚠ ' + missingProfiles.length + ' profile(s) in localStorage are MISSING from server:</span>';
          missingProfiles.forEach(p => {
            document.getElementById('server-status').innerHTML += '<br>&nbsp;&nbsp;• <b>' + p.id + '</b> — ' + (p.name || 'No name');
            log('MISSING on server: ' + p.id + ' — ' + (p.name || 'No name'));
          });
          document.getElementById('syncBtn').disabled = false;
        } else if (localProfiles.length > 0) {
          document.getElementById('server-status').innerHTML += '<br><span class="success">✓ All localStorage profiles already exist on server</span>';
          // Still allow sync to clean up localStorage
          document.getElementById('syncBtn').disabled = false;
          document.getElementById('syncBtn').textContent = 'Clean Up localStorage';
        } else {
          document.getElementById('server-status').innerHTML += '<br><span class="success">✓ Desktop and mobile should show the same count</span>';
        }
      } catch (e) {
        document.getElementById('server-status').innerHTML = '<span class="error">Cannot reach server: ' + e.message + '</span>';
        log('Server error: ' + e.message);
      }
    }

    async function syncToServer() {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerHTML = '<span class="info">Syncing...</span>';
      
      try {
        if (missingProfiles.length > 0) {
          // Enrich with cached images
          const enriched = missingProfiles.map(p => {
            if (!p.image) {
              try {
                const cached = localStorage.getItem('nikah_img_' + p.id);
                if (cached) return { ...p, image: cached };
              } catch (_) {}
            }
            return p;
          });

          // Push to server
          const res = await fetch(API_BASE + '/admin/persist-profiles', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ profiles: enriched })
          });
          const data = await res.json();
          
          if (data.success) {
            log('✓ Pushed ' + enriched.length + ' profiles to server. New total: ' + data.count);
            statusEl.innerHTML = '<span class="success">✓ Pushed ' + enriched.length + ' profile(s) to server! New total: ' + data.count + '</span>';
          } else {
            throw new Error(data.message || 'Server rejected sync');
          }
        }
        
        // Clear localStorage custom profiles
        localStorage.setItem('nikah_custom_profiles', JSON.stringify([]));
        log('✓ Cleared localStorage custom profiles');
        statusEl.innerHTML += '<br><span class="success">✓ Cleared localStorage. Desktop and mobile will now show the same profiles!</span>';
        statusEl.innerHTML += '<br><br><b>Refresh the main page to verify the fix.</b>';
        
        // Re-check
        setTimeout(checkAll, 1000);
      } catch (e) {
        statusEl.innerHTML = '<span class="error">Sync failed: ' + e.message + '</span>';
        log('Sync error: ' + e.message);
      }
    }

    // Auto-run on page load
    checkAll();
  </script>
</body>
</html>
